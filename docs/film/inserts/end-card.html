<!doctype html><html><head><meta charset="utf-8"><title>Myrosta end card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0B2A33;color:#F4FBFA;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
.card{position:relative;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(1200px 700px at 50% 40%,#0F3B45 0%,#0B2A33 60%,#081E25 100%)}
.mark{display:flex;align-items:center;gap:26px}
.dot{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#2FC4A8,#17A08A);box-shadow:0 10px 40px rgba(47,196,168,.35)}
.word{font-size:116px;font-weight:700;letter-spacing:-3px;line-height:1}
.url{font-size:40px;font-weight:500;color:#9FE3D4;letter-spacing:.5px;margin-top:4px}
.line{font-size:30px;color:#CFEDE7;margin-top:34px;font-weight:500}
.small{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:21px;line-height:1.5;color:#8FB7B0;padding:0 240px}
</style></head><body><div class="card">
<div class="mark"><div class="dot"></div><div class="word">Myrosta</div></div>
<div class="url">myrosta.com.au</div>
<div class="line">A roster that lives on the phone in your pocket.</div>
<div class="small">Dramatisation. Characters and hospital are fictional. Scenes and voices created with AI; app screens are real recordings of Myrosta.</div>
</div></body></html>
