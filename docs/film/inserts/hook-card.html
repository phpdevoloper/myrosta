<!doctype html><html><head><meta charset="utf-8"><title>Myrosta hook card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B2A33;color:#F4FBFA;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
.card{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(900px 900px at 50% 42%,#0F3B45 0%,#0B2A33 60%,#081E25 100%);text-align:center;padding:0 90px;box-sizing:border-box}
.mark{display:flex;align-items:center;gap:18px;margin-bottom:30px}.dot{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2FC4A8,#17A08A)}.word{font-size:64px;font-weight:800;letter-spacing:-2px}
.line{font-size:112px;font-weight:800;line-height:1.02;letter-spacing:-3px;text-wrap:balance}
.line b{color:#9FE3D4;font-weight:800}
.sub{font-size:40px;font-weight:500;color:#CFEDE7;margin-top:14px;line-height:1.3}
</style></head><body><div class="card">
<div class="mark"><div class="dot"></div><div class="word">Myrosta</div></div>
<div class="line">Your shifts.<br><b>Your choice.</b><br>Your calendar.</div>
<div class="sub">Self-rostering for emergency departments</div>
</div></body></html>
