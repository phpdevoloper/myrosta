<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="800" height="1130" role="img" aria-label="Myrosta staff quick start: sign in, add to phone, see your shifts, book and request.">
<title>Myrosta — Staff Quick Start</title>
<desc>A one-page quick reference for staff: 1 sign in with a 6-digit code, 2 add to your phone, 3 see your shifts, 4 book and request leave or swaps.</desc>
<rect x="0" y="0" width="800" height="1130" fill="#FFFFFF"/>
<rect x="0" y="0" width="266" height="12" fill="#E04B4B"/>
<rect x="266" y="0" width="267" height="12" fill="#F2A638"/>
<rect x="533" y="0" width="267" height="12" fill="#2FA86E"/>

<g transform="translate(58,52) scale(0.78)">
  <rect x="3" y="3" width="90" height="90" rx="22" fill="#0F243A"/>
  <path d="M44 74 L44 28 L61 54 L78 28 L78 74" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 34 L34 34" stroke="#E04B4B" stroke-width="5" stroke-linecap="round"/>
  <path d="M20 52 L31 52" stroke="#F2A638" stroke-width="5" stroke-linecap="round"/>
  <path d="M20 70 L34 70" stroke="#2FA86E" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="148" y="92" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="700"><tspan fill="#0F243A">Myr</tspan><tspan fill="#00A88E">o</tspan><tspan fill="#0F243A">sta</tspan></text>
<text x="150" y="125" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#0F243A">Staff quick start — you're set in 4 steps</text>
<line x1="55" y1="160" x2="745" y2="160" stroke="#E6E9ED" stroke-width="2"/>

<!-- ===== STEP 1 ===== -->
<rect x="55" y="195" width="690" height="185" rx="16" fill="#F5F7F9" stroke="#E6E9ED" stroke-width="1.5"/>
<rect x="80" y="213" width="110" height="150" rx="16" fill="#FFFFFF" stroke="#0F243A" stroke-width="2.5"/>
<rect x="92" y="227" width="86" height="10" rx="3" fill="#E6E9ED"/>
<rect x="96" y="270" width="11" height="15" rx="2" fill="#FFFFFF" stroke="#0F243A" stroke-width="1.5"/>
<rect x="111" y="270" width="11" height="15" rx="2" fill="#FFFFFF" stroke="#0F243A" stroke-width="1.5"/>
<rect x="126" y="270" width="11" height="15" rx="2" fill="#FFFFFF" stroke="#0F243A" stroke-width="1.5"/>
<rect x="141" y="270" width="11" height="15" rx="2" fill="#FFFFFF" stroke="#0F243A" stroke-width="1.5"/>
<rect x="156" y="270" width="11" height="15" rx="2" fill="#FFFFFF" stroke="#0F243A" stroke-width="1.5"/>
<circle cx="101.5" cy="277" r="2.4" fill="#0F243A"/><circle cx="116.5" cy="277" r="2.4" fill="#0F243A"/><circle cx="131.5" cy="277" r="2.4" fill="#0F243A"/>
<rect x="100" y="318" width="70" height="17" rx="8" fill="#00A88E"/>
<circle cx="232" cy="239" r="21" fill="#0F243A"/>
<text x="232" y="247" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
<text x="270" y="246" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F243A">Sign in</text>
<text x="270" y="280" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">Go to <tspan font-weight="700" fill="#0F243A">myrosta.com.au</tspan>, tap <tspan font-weight="700" fill="#0F243A">Sign in</tspan>,</text>
<text x="270" y="305" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">then enter your email + the <tspan font-weight="700" fill="#0F243A">6‑digit code</tspan>.</text>
<text x="270" y="330" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#6A7480">You stay signed in — it's a one‑time thing.</text>

<!-- ===== STEP 2 ===== -->
<rect x="55" y="402" width="690" height="185" rx="16" fill="#F5F7F9" stroke="#E6E9ED" stroke-width="1.5"/>
<rect x="80" y="420" width="110" height="150" rx="16" fill="#FFFFFF" stroke="#0F243A" stroke-width="2.5"/>
<g transform="translate(104,452) scale(0.3125)"><rect x="3" y="3" width="90" height="90" rx="22" fill="#0F243A"/><path d="M44 74 L44 28 L61 54 L78 28 L78 74" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 34 L34 34" stroke="#E04B4B" stroke-width="5" stroke-linecap="round"/><path d="M20 52 L31 52" stroke="#F2A638" stroke-width="5" stroke-linecap="round"/><path d="M20 70 L34 70" stroke="#2FA86E" stroke-width="5" stroke-linecap="round"/></g>
<rect x="146" y="452" width="30" height="30" rx="7" fill="#D7DBE0"/>
<rect x="104" y="494" width="30" height="30" rx="7" fill="#D7DBE0"/>
<rect x="146" y="494" width="30" height="30" rx="7" fill="#D7DBE0"/>
<circle cx="134" cy="452" r="9" fill="#00A88E"/><path d="M134 448 v8 M130 452 h8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<rect x="120" y="552" width="30" height="4" rx="2" fill="#C7CCD2"/>
<circle cx="232" cy="446" r="21" fill="#0F243A"/>
<text x="232" y="454" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
<text x="270" y="453" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F243A">Add it to your phone</text>
<text x="270" y="487" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">Tap <tspan font-weight="700" fill="#0F243A">Share → Add to Home Screen</tspan> (iPhone),</text>
<text x="270" y="512" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">or <tspan font-weight="700" fill="#0F243A">⋮ → Install</tspan> (Android), so it opens</text>
<text x="270" y="537" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#6A7480">just like an app.</text>

<!-- ===== STEP 3 ===== -->
<rect x="55" y="609" width="690" height="185" rx="16" fill="#F5F7F9" stroke="#E6E9ED" stroke-width="1.5"/>
<rect x="80" y="627" width="110" height="150" rx="16" fill="#FFFFFF" stroke="#0F243A" stroke-width="2.5"/>
<rect x="92" y="641" width="86" height="12" rx="3" fill="#0F243A"/>
<g fill="#E6E9ED">
<rect x="96" y="664" width="16" height="14" rx="2"/><rect x="116" y="664" width="16" height="14" rx="2"/><rect x="136" y="664" width="16" height="14" rx="2"/><rect x="156" y="664" width="16" height="14" rx="2"/>
<rect x="96" y="682" width="16" height="14" rx="2"/><rect x="136" y="682" width="16" height="14" rx="2"/><rect x="156" y="682" width="16" height="14" rx="2"/>
<rect x="96" y="700" width="16" height="14" rx="2"/><rect x="116" y="700" width="16" height="14" rx="2"/><rect x="136" y="700" width="16" height="14" rx="2"/>
</g>
<rect x="116" y="682" width="16" height="14" rx="2" fill="#00A88E"/>
<rect x="156" y="700" width="16" height="14" rx="2" fill="#00A88E"/>
<rect x="100" y="744" width="70" height="16" rx="8" fill="#0F243A"/>
<text x="135" y="756" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Add to calendar</text>
<circle cx="232" cy="653" r="21" fill="#0F243A"/>
<text x="232" y="661" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
<text x="270" y="660" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F243A">See your shifts</text>
<text x="270" y="694" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">Open <tspan font-weight="700" fill="#0F243A">My shifts</tspan> for your roster as a list</text>
<text x="270" y="719" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">or calendar. Tap <tspan font-weight="700" fill="#0F243A">Add to calendar</tspan> to get</text>
<text x="270" y="744" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#6A7480">shift reminders on your phone.</text>

<!-- ===== STEP 4 ===== -->
<rect x="55" y="816" width="690" height="185" rx="16" fill="#F5F7F9" stroke="#E6E9ED" stroke-width="1.5"/>
<rect x="80" y="834" width="110" height="150" rx="16" fill="#FFFFFF" stroke="#0F243A" stroke-width="2.5"/>
<rect x="92" y="848" width="86" height="10" rx="3" fill="#E6E9ED"/>
<rect x="96" y="872" width="62" height="13" rx="3" fill="#E6E9ED"/><circle cx="170" cy="878.5" r="8" fill="#2FA86E"/><path d="M166 879 l3 3 l5 -6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="96" y="894" width="62" height="13" rx="3" fill="#E6E9ED"/><circle cx="170" cy="900.5" r="8" fill="#D7DBE0"/>
<rect x="96" y="916" width="62" height="13" rx="3" fill="#E6E9ED"/><circle cx="170" cy="922.5" r="8" fill="#D7DBE0"/>
<rect x="96" y="938" width="62" height="13" rx="3" fill="#E6E9ED"/><circle cx="170" cy="944.5" r="8" fill="#2FA86E"/><path d="M166 945 l3 3 l5 -6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="232" cy="860" r="21" fill="#0F243A"/>
<text x="232" y="868" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
<text x="270" y="867" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#0F243A">Book &amp; request</text>
<text x="270" y="901" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">When <tspan font-weight="700" fill="#0F243A">Self‑roster</tspan> opens, tap a free slot</text>
<text x="270" y="926" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#22262B">to book it. Need time off? <tspan font-weight="700" fill="#0F243A">Requests →</tspan></text>
<text x="270" y="951" font-family="Helvetica Neue, Arial, sans-serif" font-size="16.5" fill="#6A7480">Request leave or Request a swap.</text>

<!-- ===== FOOTER ===== -->
<rect x="55" y="1020" width="690" height="78" rx="16" fill="#0F243A"/>
<text x="400" y="1047" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9FB0C0">Open it any time at</text>
<text x="400" y="1073" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700"><tspan fill="#FFFFFF">myr</tspan><tspan fill="#00A88E">o</tspan><tspan fill="#FFFFFF">sta.com.au</tspan></text>
<text x="400" y="1091" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#9FB0C0">No code arriving? Check junk, tap Resend — still stuck, message your admin.</text>
<rect x="0" y="1118" width="266" height="12" fill="#E04B4B"/>
<rect x="266" y="1118" width="267" height="12" fill="#F2A638"/>
<rect x="533" y="1118" width="267" height="12" fill="#2FA86E"/>
</svg>
