<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --topbar:rgba(255,255,255,.82);
    --line:rgba(11,18,32,.08); --line2:rgba(11,18,32,.16);
    --text:#0B1220; --muted:#5A636E; --hint:#9AA3AD;
    --accent:#00A88E; --accent-2:#0B8A75; --accent-bg:#E6F5F1;
    --hover:#F1F3F5; --we:#E8ECF2;
    --am:#E6EEFB; --am-t:#2D5BA6; --pm:#FBE9CE; --pm-t:#8A5A12;
    --cst:#E4F2E8; --cst-t:#2F6B43; --leave:#ECEAFB; --leave-t:#5448A8;
    --warn:#FBF0DA; --warn-t:#8A5A12; --ok:#E3F4EC; --ok-t:#1E6B45;
    --danger-bg:#FCE7E7; --danger-t:#B23B3F;
    --rag-g:#2BB673; --rag-a:#E8A33D; --rag-r:#E5575B;
    --gap-bg:#FCE7E7; --gaphdr-bg:#FBF0DA;
    --navy:#0F243A; --radius:12px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(11,18,32,.04), 0 14px 34px rgba(11,18,32,.08);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.01em}
  a{color:var(--accent)}
  button{font-family:inherit;font-size:14px;cursor:pointer}
  .btn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:9px 15px;display:inline-flex;align-items:center;gap:7px;font-weight:500;transition:background .15s,transform .1s,border-color .15s}
  .btn:hover{background:var(--hover)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:var(--danger-t);border-color:var(--line2)}
  .btn.danger:hover{background:var(--danger-bg)}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  label{font-size:13px;color:var(--muted)}
  .topbar{background:var(--topbar);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px}
  .brand .dot{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
  .brand .logo{width:28px;height:28px;display:block;flex:none}
  .brand .wordmark{font-weight:600;font-size:18px;color:var(--text);letter-spacing:-.3px}
  .brand .wordmark .accent{color:var(--accent)}
  .tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap}
  .tab{border:none;background:none;padding:8px 12px;border-radius:var(--radius-sm);color:var(--muted);font-weight:500;transition:color .15s,background .15s}
  .tab:hover{background:var(--hover);color:var(--text)}
  .tab.active{background:none;color:var(--accent);font-weight:600}
  .viewas{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
  .card h2{font-size:17px;margin-bottom:3px;letter-spacing:-.01em}
  .card .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;line-height:1.5}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .tile{background:var(--bg);border-radius:var(--radius-sm);padding:11px 13px}
  .tile .k{font-size:12px;color:var(--muted)}
  .tile .v{font-size:22px;font-weight:600;margin-top:2px}
  table{border-collapse:collapse;width:100%}
  .chip{display:inline-block;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap}
  .chip.am{background:var(--am);color:var(--am-t)} .chip.pm{background:var(--pm);color:var(--pm-t)}
  .chip.cst{background:var(--cst);color:var(--cst-t)} .chip.leave{background:var(--leave);color:var(--leave-t)}
  .maptbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .maptbl th{text-align:left;color:var(--muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line)}
  .maptbl td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .maptbl select{max-width:200px}
  .maptbl th.num,.maptbl td.num{text-align:center}
  .qt-cell{width:52px;text-align:center;padding:5px 4px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .qt-cell::-webkit-outer-spin-button,.qt-cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
  .pill.ok{background:var(--ok);color:var(--ok-t)} .pill.warn{background:var(--warn);color:var(--warn-t)} .pill.danger{background:var(--danger-bg);color:var(--danger-t)}
  .pill.muted{background:var(--hover);color:var(--muted)}
  /* admin grid */
  .gridscroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);max-height:72vh}
  table.roster{border-collapse:separate;border-spacing:0;font-size:12px}
  table.roster th,table.roster td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
  table.roster thead th{position:sticky;top:0;background:var(--surface);z-index:5;min-width:62px;padding:5px 4px;font-weight:500}
  table.roster thead th.we{background:var(--we)}
  table.roster .namecol{position:sticky;left:0;background:var(--surface);z-index:6;text-align:left;padding:6px 10px;min-width:150px;font-weight:500;border-right:1px solid var(--line2)}
  table.roster thead th.corner{z-index:7;left:0;position:sticky}
  table.roster td.cell{cursor:pointer;height:30px}
  table.roster td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
  table.roster td.we{background:var(--we)}
  table.roster .dimcol{opacity:.3}
  table.roster th.gaphdr{background:var(--gaphdr-bg)}
  table.roster td.gapcell{background:var(--gap-bg);color:var(--danger-t)}
  table.roster td.gapcell .cap b{color:var(--danger-t)}
  table.roster td{position:relative}
  .editdot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  table.roster td.pcell{cursor:pointer}
  table.roster td.pcell:hover{outline:2px solid var(--accent);outline-offset:-2px}
  .daynum{font-weight:600;font-size:13px} .dayname{font-size:10px;color:var(--hint);text-transform:uppercase}
  .cap{font-size:10px;margin-top:2px}
  .cap b{font-weight:600}
  .full-cell{display:block;padding:3px 2px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,24,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:var(--surface);border-radius:var(--radius);max-width:420px;width:100%;padding:20px;max-height:90vh;overflow:auto}
  .modal h3{font-size:16px;margin-bottom:4px}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .seg button{border:1px solid var(--line2);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg button:disabled{opacity:.4;cursor:not-allowed}
  .zonebtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
  .zonebtns button{border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius-sm);padding:9px;font-size:13px;text-align:left}
  .zonebtns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .zonebtns button:disabled{opacity:.45;cursor:not-allowed;background:var(--hover)}
  .taken{font-size:11px;color:var(--hint)}
  .note{font-size:12px;color:var(--muted);background:var(--bg);border-radius:var(--radius-sm);padding:9px 11px;margin-top:8px}
  .listrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:none}
  .grow{flex:1}
  .agday{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .agday .d{width:42px;text-align:center}
  .agday .d .dn{font-size:12px;color:var(--muted)} .agday .d .dd{font-size:16px;font-weight:600}
  .agday.we{background:var(--we);border-radius:8px;padding-left:8px;padding-right:8px;border-bottom-color:transparent}
  .agday.we .d .dn{color:var(--accent)}
  .mcell.we{background:var(--we)} .dow.we{color:var(--accent)}
  .weekhdr{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
  .monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
  .monthgrid .dow{font-size:11px;color:var(--muted);text-align:center;padding:3px 0}
  .mcell{min-height:54px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11px}
  .mcell.out{background:var(--we);opacity:.5}
  .mcell .mn{font-size:11px;color:var(--muted)}
  .muted{color:var(--muted)} .small{font-size:13px}
  .flexbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .badge-mode{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--accent-bg);color:var(--accent)}
  .bell{position:relative;border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius-sm);padding:6px 9px;line-height:1;font-size:15px;cursor:pointer}
  .bell:hover{background:#f0f2f5}
  .bell .bi{font-style:normal}
  .bell-badge{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;padding:0 4px;background:#e23b3b;color:#fff;border-radius:9px;font-size:11px;display:none;align-items:center;justify-content:center;font-weight:600}
  .msg{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;background:var(--surface)}
  .msg.mine{background:var(--accent-bg);border-color:#cfe0fb}
  .msg .meta{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
  .notif{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .notif .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
  .notif.read{color:var(--muted)}
  .notif.read .dot{background:transparent;border:1px solid var(--line2)}
  .hide{display:none}
  .gridscroll{-webkit-overflow-scrolling:touch}
  @media(max-width:640px){
    body{font-size:15px}
    .topbar{padding:8px 10px;gap:7px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
    .brand .logo{width:26px;height:26px} .brand .wordmark{font-size:17px}
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;order:5;width:100%;margin-top:2px}
    .tab{padding:8px 11px;white-space:nowrap}
    .viewas{font-size:12px}
    .wrap{padding:14px 12px 70px}
    .card{padding:14px}
    h2{font-size:18px}
    .row{flex-direction:column;align-items:stretch}
    .row .field{width:100%}
    .field input,.field select,.field textarea{width:100%}
    input,select,textarea{font-size:16px}   /* prevents iOS zoom-on-focus */
    .btn{padding:10px 14px} .btn.sm{padding:8px 12px}
    .seg button{padding:8px 14px}
    .agday{padding:13px 0}
    .grid-tiles{grid-template-columns:repeat(2,1fr)}
    .zonebtns{grid-template-columns:1fr}
    .overlay{padding:10px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0F243A"/><path d="M17 31 L17 11 L24.5 22 L32 11 L32 31" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 13 L14 13" fill="none" stroke="#E04B4B" stroke-width="2.2" stroke-linecap="round"/><path d="M7 21 L12 21" fill="none" stroke="#F2A638" stroke-width="2.2" stroke-linecap="round"/><path d="M7 29 L14 29" fill="none" stroke="#2FA86E" stroke-width="2.2" stroke-linecap="round"/></svg><span class="wordmark">Myr<span class="accent">o</span>sta</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="viewas" id="cycleWrap">Cycle <select id="cycleSel"></select></div>
  <span class="pill" id="statusPill"></span>
  <span class="pill" id="cloudPill" style="display:none"></span>
  <button class="bell" id="bell" aria-label="Notifications"><i class="bi">🔔</i><span class="bell-badge" id="bellBadge"></span></button>
  <div class="viewas" id="viewAsWrap">View as
    <select id="viewAs"></select>
  </div>
  <button class="btn sm" id="logoutBtn" style="display:none">Sign out</button>
</div>
<div class="wrap" id="app"></div>
<div id="modalRoot"></div>

<script>
"use strict";

/* ---------- defaults (clean — no demo data) ---------- */
const LEAVE_CODES = ["AL","CME","UA","UPL","PH","LSL","Sab","PL","Other","Orientation","Vacant"];
const LEAVE_LABEL = {AL:"Annual leave",CME:"CME leave",UA:"Unavailable",UPL:"Unplanned leave",PH:"Public holiday",LSL:"Long service leave",Sab:"Sabbatical",PL:"Private leave",Other:"Other",Orientation:"Orientation",Vacant:"Vacant"};
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");}
function initialsFrom(name){
  const p=name.split(",");
  if(p.length>=2){return ((p[1].trim()[0]||"")+(p[0].trim()[0]||"")).toUpperCase();}
  const w=name.trim().split(/\s+/);return w.map(x=>x[0]).join("").slice(0,2).toUpperCase();
}
function mondayOf(dt){const x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function defaultState(){
  // Clean organisation — no demo data. Populate by importing your roster + leave planner.
  return {
    zones:[
      {id:"roc", name:"ROC", am:true, pm:true, pmLabel:"ROC+OC"},
      {id:"rap", name:"RAP", am:true, pm:true, pmLabel:""},
      {id:"pft", name:"PFT", am:true, pm:true, pmLabel:""},
      {id:"asap",name:"ASAP",am:true, pm:true, pmLabel:""}
    ],
    staffing:{amMin:3, amMax:4, pmMin:3, pmMax:4},
    leaveCapEft:3,
    fairness:"snake",
    staff:[],
    cycles:[{id:"cyc-1", cycle:{start:iso(mondayOf(new Date())), weeks:8}, assign:{}, status:"draft", archived:false}],
    activeId:"cyc-1",
    messages:[],
    notifications:[],
    requests:[],
    leave:[],
    audit:[],
    viewAs:"admin",
    tab:"setup"
  };
}

/* ---------- persistence ---------- */
const KEY="ed-roster-v1";
let S;
// ===== Cloud (Supabase) config — leave url/key EMPTY for local-only mode. =====
// Fill these in (Supabase project URL + anon public key) to switch the whole app
// to shared cloud storage. See SUPABASE.md for the 5-minute setup.
const CLOUD={ url:"https://efkadypqecqtltjtfmtj.supabase.co", key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVma2FkeXBxZWNxdGx0anRmbXRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjU0NzMsImV4cCI6MjA5NzEwMTQ3M30.daixXB61a4pJM2yz7F8Dq8EuPCjpc5_tUAc0AQPXMsI", org:"ed-default", adminEmails:["drranjith0713@gmail.com"], allowedDomains:[] };
function cloudOn(){ return !!(CLOUD.url && CLOUD.key); }
let authUser=null, authState="local", _subscribed=false, _members=[], _otpEmail="", _otpSent=false; // local | login | denied | in
function resolveIdentity(email){ if(!email)return null; const e=String(email).toLowerCase();
  if((CLOUD.adminEmails||[]).map(x=>String(x).toLowerCase()).includes(e))return "admin";
  const s=S.staff.find(x=>(x.email||"").toLowerCase()===e); return s?s.id:null; }
function normalize(){
  if(!S.zones||!S.staff||!S.staffing)throw new Error("incomplete state");
  if(!S.cycles){ // migrate old single-cycle shape -> multi-cycle
    const first={id:"cyc-"+Date.now(),cycle:S.cycle||{start:"2026-06-08",weeks:8},assign:S.assign||{},status:S.status||"draft",archived:false};
    const arch=(S.archive||[]).map(a=>({id:a.id,cycle:a.cycle,assign:a.assign||{},status:a.status||"published",archived:true}));
    S.cycles=[first].concat(arch); S.activeId=first.id;
    delete S.cycle; delete S.assign; delete S.status; delete S.archive;
  }
  if(!S.activeId||!S.cycles.find(c=>c.id===S.activeId))S.activeId=(S.cycles.find(c=>!c.archived)||S.cycles[0]).id;
  if(!S.messages)S.messages=[]; if(!S.notifications)S.notifications=[];
  if(!S.requests)S.requests=[]; if(!S.leave)S.leave=[]; if(!S.audit)S.audit=[];
  if(S.leaveCapEft==null)S.leaveCapEft=3;
  if(S.payrollDateFmt==null)S.payrollDateFmt="DD/MM/YYYY";
  if(S.quotaPeriod==null)S.quotaPeriod="fortnight";   // cycle | week | fortnight | month — how clinical quota is counted/capped
  if(S.quotaCapMode==null)S.quotaCapMode="hard";       // hard | soft | off — whether per-period target caps booking
  if(S.waveCount==null)S.waveCount=3;                   // number of cohorts for "waves" fairness mode
  if(S.guideDismissed==null)S.guideDismissed=false;     // setup wizard shown until dismissed
  if(S.unlockOrder==null)S.unlockOrder="pmfirst";       // extra-slot unlock order: both | amfirst | pmfirst
  S.staff.forEach(s=>{ if(s.eft==null)s.eft=1; if(s.hrsFortnight==null)s.hrsFortnight=76; if(s.email==null)s.email=""; if(s.payrollId==null)s.payrollId=""; if(!s.fixedPattern)s.fixedPattern={recurrence:"weekly",A:{},B:{},committed:false}; if(!s.periodTargets)s.periodTargets={}; });
}
function load(){ try{ S=JSON.parse(localStorage.getItem(KEY))||defaultState(); normalize(); }catch(e){ S=defaultState(); } }
/* ----- cloud storage layer (only active when cloudOn()) ----- */
let _sb=null, _cloudTimer=null, _applyingRemote=false, cloudState="local", _orgUpdated=null;
function cloudInit(){ if(_sb)return; _sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }
async function cloudLoad(){ const {data,error}=await _sb.from("org_state").select("data,updated").eq("org",CLOUD.org).maybeSingle(); if(error)throw error; if(data)_orgUpdated=data.updated; return data?data.data:null; }
async function cloudSave(){ if(!_sb)return; try{ const ts=new Date().toISOString(); const {data,error}=await _sb.from("org_state").upsert({org:CLOUD.org,data:S,updated:ts}).select("updated").maybeSingle(); if(error)throw error; _orgUpdated=(data&&data.updated)||ts; }catch(e){ console.error("cloudSave",e); cloudState="error"; } }
// Atomic compare-and-swap: applies `mutate` to the freshest state and writes only if the
// record hasn't changed since we loaded it. On conflict it pulls the latest and re-runs
// `mutate` (which re-validates capacity), so concurrent bookings merge instead of clobbering.
async function cloudCommit(mutate){
  for(let i=0;i<6;i++){
    const res=mutate(); if(!res.ok)return res;
    clearTimeout(_cloudTimer);
    const ts=new Date().toISOString();
    let r; try{ r=await _sb.from("org_state").update({data:S,updated:ts}).eq("org",CLOUD.org).eq("updated",_orgUpdated).select("updated").maybeSingle(); }
    catch(e){ console.error("commit",e); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){} return {ok:true}; }
    if(r.error){ console.error(r.error); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){} return {ok:true}; }
    if(r.data){ _orgUpdated=r.data.updated; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){} return {ok:true}; }
    const f=await _sb.from("org_state").select("data,updated").eq("org",CLOUD.org).maybeSingle();   // CAS conflict -> reload + retry
    if(f.data){ _applyingRemote=true; S=f.data.data; _orgUpdated=f.data.updated; try{normalize();}catch(e){} _applyingRemote=false; }
  }
  return {ok:false,reason:"Too many people booking at once — please try again."};
}
// Runs a validate+mutate atomically: synchronous in local mode, CAS-guarded in cloud mode.
function commitGuarded(mutate){
  if(!cloudOn()){ const res=mutate(); if(!res.ok){ if(res.reason)alert(res.reason); return false; } save(); render(); return true; }
  cloudCommit(mutate).then(res=>{ if(!res.ok&&res.reason)alert(res.reason); render(); });
  return true;
}
function cloudSubscribe(){ try{ _sb.channel("org-"+CLOUD.org).on("postgres_changes",{event:"*",schema:"public",table:"org_state",filter:"org=eq."+CLOUD.org},p=>{
    if(p.new&&p.new.data){ _orgUpdated=p.new.updated; const incoming=JSON.stringify(p.new.data); if(incoming===JSON.stringify(S))return; _applyingRemote=true; S=p.new.data; try{normalize();}catch(e){} localStorage.setItem(KEY,incoming); _applyingRemote=false; render(); } }).subscribe(); }catch(e){ console.error("subscribe",e); } }

/* ---------- date helpers ---------- */
function pad(n){return String(n).padStart(2,"0");}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseISO(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function fmt(d,o){return d.toLocaleDateString("en-GB",o||{day:"numeric",month:"short"});}
function datesOf(c){const out=[];let s=parseISO(c.start);for(let i=0;i<c.weeks*7;i++)out.push(addDays(s,i));return out;}
function cycleDates(){return datesOf(CTX().cycle);}
function inCycle(d){const ds=cycleDates();return d>=ds[0]&&d<=ds[ds.length-1];}

/* ---------- shift model ---------- */

function zonesFor(period){return S.zones.filter(z=>period==="AM"?z.am:z.pm);}
function zoneLabel(z,period){return period==="PM"&&z.pmLabel?z.pmLabel:z.name;}
function periodTime(p){return p==="AM"?"08:00–16:00":"15:30–23:30";}
function getShift(staffId,isoD){const a=CTX().assign[staffId+"|"+isoD];if(a)return a;const lv=leaveOn(staffId,isoD);if(lv)return {kind:"leave",code:lv.code};return {kind:"off"};}
function setShift(staffId,isoD,sh){const a=CTX().assign;const k=staffId+"|"+isoD; if(!sh||sh.kind==="off")delete a[k]; else a[k]=sh; save();}
function clinicalCounts(isoD,excludeId){
  let am=0,pm=0;
  for(const s of S.staff){ if(s.id===excludeId)continue; const sh=getShift(s.id,isoD); if(sh.kind==="clinical"){sh.period==="AM"?am++:pm++;} }
  return {am,pm};
}
function zoneTaken(isoD,period,zoneId,excludeId){
  for(const s of S.staff){ if(s.id===excludeId)continue; const sh=getShift(s.id,isoD);
    if(sh.kind==="clinical"&&sh.period===period&&sh.zone===zoneId)return s; }
  return null;
}
// progressive unlock, parameterised by configurable staffing
function periodUnlocked(isoD,period,excludeId){
  const {am,pm}=clinicalCounts(isoD,excludeId);
  const cur=period==="AM"?am:pm;
  const reqT=period==="AM"?S.staffing.amMin:S.staffing.pmMin;
  const maxT=period==="AM"?S.staffing.amMax:S.staffing.pmMax;
  const zmax=zonesFor(period).length;
  const cap=Math.min(maxT,zmax);
  if(cur>=cap)return {ok:false,reason:`${period} is full (${cur}/${cap})`};
  if(cur<reqT)return {ok:true};                         // still filling this period's minimum
  if(am<S.staffing.amMin||pm<S.staffing.pmMin)
    return {ok:false,reason:`Fill the minimum first (${S.staffing.amMin} AM + ${S.staffing.pmMin} PM)`};
  const order=S.unlockOrder||"pmfirst";
  if(order==="both")return {ok:true};                   // extras open together — no AM/PM ordering
  const firstP=order==="amfirst"?"AM":"PM";             // ordered: "first" period's extras fill before the other's open
  if(period===firstP)return {ok:true};
  const otherCap=Math.min(firstP==="AM"?S.staffing.amMax:S.staffing.pmMax, zonesFor(firstP).length);
  const otherCur=firstP==="AM"?am:pm;
  if(otherCur>=otherCap)return {ok:true};
  return {ok:false,reason:`Extra ${firstP} opens before extra ${period} — fill ${firstP} first`};
}
function unlockOrderLabel(){return {both:"AM & PM open together",amfirst:"AM before PM",pmfirst:"PM before AM"}[S.unlockOrder||"pmfirst"];}

/* ---------- self-roster + auto-draft engine ---------- */
function clinicalCountFor(staffId){let n=0;const a=active().assign;cycleDates().forEach(d=>{const sh=a[staffId+"|"+iso(d)];if(sh&&sh.kind==="clinical")n++;});return n;}
/* ---------- quota periods + per-period targets ---------- */
function periodWeeks(){return {cycle:999,week:1,fortnight:2,month:4}[S.quotaPeriod||"fortnight"];}
function periodTag(){return {cycle:"Cycle",week:"Wk",fortnight:"Fn",month:"Mo"}[S.quotaPeriod||"fortnight"];}
function cyclePeriods(){ const ds=cycleDates(), per=periodWeeks()*7, out=[];
  for(let st=0; st<ds.length; st+=per){ const slice=ds.slice(st,st+per); if(!slice.length)break;
    out.push({index:out.length, dates:slice, from:iso(slice[0]), to:iso(slice[slice.length-1]),
      label:(S.quotaPeriod==="cycle"?"Cycle":periodTag()+" "+(out.length+1))}); }
  return out; }
function lrRound(weights,total){ const n=weights.length; total=Math.max(0,Math.round(total||0)); if(!n)return [];
  const sum=weights.reduce((a,b)=>a+b,0);
  if(sum<=0){ const base=Math.floor(total/n), r=total-base*n; return weights.map((_,i)=>base+(i<r?1:0)); }
  const raw=weights.map(w=>total*w/sum), floors=raw.map(Math.floor);
  let rem=total-floors.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
  const res=floors.slice(); for(let k=0;k<rem;k++)res[order[k].i]++; return res; }
function autoPeriodTargets(s){ const periods=cyclePeriods();
  const weights=periods.map(p=>p.dates.filter(d=>getShift(s.id,iso(d)).kind!=="leave").length); // pro-rata to available (non-leave) days
  return lrRound(weights, s.quota||0); }
function periodTarget(s,i){ const ov=s.periodTargets&&s.periodTargets[i]; return (ov!=null&&ov!=="")?(+ov):autoPeriodTargets(s)[i]; }
function periodTargetsOf(s){ const auto=autoPeriodTargets(s); return cyclePeriods().map((p,i)=>{ const ov=s.periodTargets&&s.periodTargets[i]; return (ov!=null&&ov!=="")?(+ov):auto[i]; }); }

function fillPeriodTo(isoD,period,target){let filled=0;

    if(cnt>=target)break;

    const z=freeZones(isoD,period)[0];if(!z)break;
    let pool=eligibleStaff(isoD).filter(s=>clinicalCountFor(s.id)<(s.quota||999));
    if(!pool.length)pool=eligibleStaff(isoD);
    if(!pool.length)break;
    pool.sort((a,b)=>clinicalCountFor(a.id)-clinicalCountFor(b.id));

function autoDraft(toMax){

  ds.forEach(d=>{const i=iso(d);filled+=fillPeriodTo(i,"AM",S.staffing.amMin);filled+=fillPeriodTo(i,"PM",S.staffing.pmMin);});
  if(toMax){ds.forEach(d=>{const i=iso(d);filled+=fillPeriodTo(i,"PM",Math.min(S.staffing.pmMax,zonesFor("PM").length));filled+=fillPeriodTo(i,"AM",Math.min(S.staffing.amMax,zonesFor("AM").length));});}
  let gaps=0;ds.forEach(d=>{const g=dayGap(iso(d));gaps+=g.am+g.pm;});
  logAudit("selfroster.autodraft",(toMax?"fill-to-max":"minimum")+" · placed "+filled+" · gaps left "+gaps,"admin");save();

function clearShifts(){const a=active().assign;Object.keys(a).forEach(k=>{const v=a[k];if((v.kind==="clinical"&&!v.fixed)||v.kind==="cst")delete a[k];});logAudit("selfroster.clear","cleared shifts (kept fixed) in "+cyLabel(active()),"admin");save();}
function canBook(sid,isoD,p,zoneId){
  const sh=getShift(sid,isoD);

  if(sh.kind!=="off")return {ok:false,reason:"already has a shift that day"};
  if(zoneTaken(isoD,p,zoneId,sid))return {ok:false,reason:"zone already taken"};
  const u=periodUnlocked(isoD,p,sid);if(!u.ok)return u;
  if(S.fairness==="snake"&&active().draft&&whoseTurn()!==sid)return {ok:false,reason:"not your turn"};
  if(S.fairness==="waves"&&active().waveState&&!currentCohort().includes(sid))return {ok:false,reason:"your wave hasn't opened yet"};
  if((S.quotaCapMode||"hard")==="hard"){ const per=periodOfDate(isoD), st=S.staff.find(x=>x.id===sid);
    if(per&&st){ const tgt=periodTarget(st,per.index); if(tgt>0&&bookedInPeriod(sid,per)>=tgt)

    active().assign[sid+"|"+isoD]={kind:"clinical",period:p,zone:zoneId};
    logAudit("selfroster.book",nameOf(sid)+" "+isoD+" "+p+" "+(zoneById(zoneId)?zoneById(zoneId).name:""),sid);
    if(S.fairness==="snake"&&active().draft)advanceTurn(); return {ok:true}; });

function startWaves(){ const ids=shuffle(S.staff.map(s=>s.id)); const n=Math.max(2,Math.min(4,S.waveCount||3));

function wavePosOf(sid){const w=active().waveState;if(!w)return -1;for(let p=0;p<w.order.length;p++){if((w.cohorts[w.order[p]]||[]).includes(sid))return p;}return -1;}

function advanceWave(){const w=active().waveState;if(!w)return;if(w.current<w.order.length-1){w.current++;notify("all","Self-roster wave "+(w.current+1)+" is now open.");logAudit("selfroster.wave.advance","wave "+(w.current+1)+" opened","admin");}else{logAudit("selfroster.wave.advance","all waves complete","admin");}save();}

/* ---------- fixed patterns (weekly + fortnightly A/B) ---------- */
let _fpDraft={};            // sid -> in-progress edit copy (survives re-render)

const WD_ORDER=[1,2,3,4,5,6,0]; // Mon..Sun (getDay() indices)
function emptyPattern(){return {recurrence:"weekly",A:{},B:{},committed:false};}
function cycleWeekAB(isoD){const ds=cycleDates();const wk=Math.floor((parseISO(isoD)-ds[0])/(7*864e5));return wk%2===0?"A":"B";}
function fixedSlotFor(s,isoD){ if(!s||(s.mode!=="fixed"&&s.mode!=="preference"))return null; const fp=s.fixedPattern; if(!fp)return null;
  const wd=String(parseISO(isoD).getDay()); const wk=(fp.recurrence==="fortnightly")?cycleWeekAB(isoD):"A";
  const slot=(fp[wk]||{})[wd]; if(!slot||!slot.period||!slot.zone)return null; return {period:slot.period,zone:slot.zone}; }
function applyFixedPatterns(){ // seed fixed (locked) + preference (soft) shifts where the day is free
  let placed=0; const a=active().assign;
  S.staff.forEach(s=>{ if(s.mode!=="fixed"&&s.mode!=="preference")return;
    cycleDates().forEach(d=>{ const isoD=iso(d), slot=fixedSlotFor(s,isoD); if(!slot)return;
      const cur=getShift(s.id,isoD); if(cur.kind!=="off")return;                 // leave / existing shift wins
      if(zoneTaken(isoD,slot.period,slot.zone,s.id))return;                       // zone clash -> skip
      a[s.id+"|"+isoD]={kind:"clinical",period:slot.period,zone:slot.zone,fixed:(s.mode==="fixed")}; placed++; }); });
  return placed; }
function fixedPatternSummary(fp){ if(!fp)return "—"; const out=[];
  ["A","B"].forEach(wk=>{ if(wk==="B"&&fp.recurrence!=="fortnightly")return; const o=fp[wk]||{};
    const days=WD_ORDER.filter(wd=>o[String(wd)]&&o[String(wd)].period&&o[String(wd)].zone)
      .map(wd=>DOW[wd]+" "+o[String(wd)].period+"·"+(zoneById(o[String(wd)].zone)?zoneById(o[String(wd)].zone).name:"?"));
    if(days.length)out.push((fp.recurrence==="fortnightly"?("Wk "+wk+": "):"")+days.join(", ")); });
  return out.length?out.join(" · "):"no shifts set"; }
function fpDraft(s){ if(!_fpDraft[s.id]){ const src=s.fixedPattern||emptyPattern(); _fpDraft[s.id]=JSON.parse(JSON.stringify(src));
  const d=_fpDraft[s.id]; if(!d.A)d.A={}; if(!d.B)d.B={}; if(!d.recurrence)d.recurrence="weekly"; } return _fpDraft[s.id]; }
function setFpSlot(sid,wk,wd,key,val){ const s=S.staff.find(x=>x.id===sid); const d=fpDraft(s); d[wk]=d[wk]||{}; const k=String(wd);

      <td><select class="fp-z" data-sid="${s.id}" data-wk="${wk}" data-wd="${wd}" ${canEdit?"":"disabled"}><option value="">—</option>${S.zones.map(z=>`<option value="${z.id}" ${slot.zone===z.id?"selected":""}>${escapeHTML(z.name)}</option>`).join("")}</select></td></tr>`;
  }).join("")+`</table>`; }
function fixedPatternEditorHTML(s,canEdit,asStaff){ const d=fpDraft(s); const committed=!!(s.fixedPattern&&s.fixedPattern.committed);

  if(s.mode==="self") return `<div class="card" style="margin-top:8px;background:var(--hover)"><b>Fixed pattern — ${escapeHTML(s.name)}</b> <span class="badge-mode">self</span><div class="muted small" style="margin-top:6px">On <b>Self-roster</b> — no fixed pattern. Switch mode to “Fixed pattern” or “Pref + auto-draft” to set one.</div></div>`;

function saveFixedPattern(sid,asStaff){ const s=S.staff.find(x=>x.id===sid); const d=fpDraft(s);

function renderZoneList(){
  const el=document.getElementById("zoneList");if(!el)return;
  el.innerHTML=S.zones.map(z=>`
    <div class="listrow" data-z="${z.id}">
      <input class="z-name" value="${z.name}" style="width:120px" placeholder="Name">
      <label><input type="checkbox" class="z-am" ${z.am?"checked":""}> AM</label>
      <label><input type="checkbox" class="z-pm" ${z.pm?"checked":""}> PM</label>
      <input class="z-pml" value="${z.pmLabel||""}" placeholder="PM label (opt)" style="width:130px">
      <span class="grow"></span>
      <button class="btn danger sm z-del">Remove</button>
    </div>`).join("");
  el.querySelectorAll("[data-z]").forEach(rowEl=>{
    const id=rowEl.dataset.z; const z=zoneById(id);
    rowEl.querySelector(".z-name").onchange=e=>{z.name=e.target.value;save();};
    rowEl.querySelector(".z-am").onchange=e=>{z.am=e.target.checked;save();};
    rowEl.querySelector(".z-pm").onchange=e=>{z.pm=e.target.checked;save();};
    rowEl.querySelector(".z-pml").onchange=e=>{z.pmLabel=e.target.value;save();};
    rowEl.querySelector(".z-del").onclick=()=>{S.zones=S.zones.filter(x=>x.id!==id);save();render();};
  });
}

function dayGap(isoD){const {am,pm}=clinicalCounts(isoD,null);return {am:Math.max(0,S.staffing.amMin-am),pm:Math.max(0,S.staffing.pmMin-pm)};}
function ragFor(isoD){const {am,pm}=clinicalCounts(isoD,null);const aM=S.staffing.amMin,pM=S.staffing.pmMin;if(am<aM||pm<pM)return"r";if(am===aM||pm===pM)return"a";return"g";}
function ragColor(x){return x==="r"?"var(--rag-r)":x==="a"?"var(--rag-a)":"var(--rag-g)";}
function viewRoster(){
  const ds=cycleDates();
  let totalGap=0;
  const head=`<tr><th class="corner namecol">Consultant</th>`+ds.map(d=>{
    const we=[0,6].includes(d.getDay());const g=dayGap(iso(d));const isGap=g.am>0||g.pm>0;
    const gc=gapsOn?(isGap?"gaphdr":"dimcol"):(we?"we":"");
    return `<th class="${gc}"><div class="dayname">${DOW[d.getDay()]}</div><div class="daynum">${d.getDate()}</div><div class="muted" style="font-size:9px">${fmt(d,{month:"short"})}</div></th>`;
  }).join("")+`</tr>`;
  const caprow=`<tr><th class="namecol" style="font-weight:500;color:var(--muted);font-size:11px">Cover · AM / PM</th>`+ds.map(d=>{
    const isoD=iso(d);const {am,pm}=clinicalCounts(isoD,null);const we=[0,6].includes(d.getDay());
    const g=dayGap(isoD);const isGap=g.am>0||g.pm>0;totalGap+=g.am+g.pm;
    const amok=am>=S.staffing.amMin, pmok=pm>=S.staffing.pmMin;
    const cls=gapsOn?(isGap?"gapcell":"dimcol"):(we?"we":"");
    const bar=`<div style="height:3px;border-radius:2px;background:${ragColor(ragFor(isoD))};margin:1px 5px 3px"></div>`;
    const inner=(gapsOn&&isGap)
      ? bar+`<div class="cap"><b>need ${[g.am?"AM "+g.am:"",g.pm?"PM "+g.pm:""].filter(Boolean).join(", ")}</b></div>`
      : bar+`<div class="cap"><span style="color:${amok?"var(--am-t)":"var(--rag-r)"}"><b>${am}</b></span> / <span style="color:${pmok?"var(--pm-t)":"var(--rag-r)"}"><b>${pm}</b></span></div>`;
    return `<td class="${cls}">${inner}</td>`;
  }).join("")+`</tr>`;
  let redD=0,ambD=0; ds.forEach(d=>{const r=ragFor(iso(d));if(r==="r")redD++;else if(r==="a")ambD++;});
  const statusPill=!S.staff.length?"":(redD?`<span class="pill danger">● ${redD} day${redD>1?"s":""} need cover</span>`:(ambD?`<span class="pill warn">● ${ambD} at minimum</span>`:`<span class="pill ok">● Fully covered</span>`));
  const editable=canEdit();
  const body=S.staff.map(s=>{
    return `<tr><td class="namecol">${s.name} <span class="badge-mode">${({self:"self",fixed:"fix",preference:"pref"})[s.mode]}</span></td>`+ds.map(d=>{
      const isoD=iso(d);const sh=getShift(s.id,isoD);const we=[0,6].includes(d.getDay());
      const g=dayGap(isoD);const isGap=g.am>0||g.pm>0;
      const gc=gapsOn?(isGap?(we?"we":""):"dimcol"):(we?"we":"");
      const note=sh.note?`title="✎ ${escapeHTML(sh.note)} — ${escapeHTML(sh.noteBy||"admin")}"`:"";
      return `<td class="${editable?"cell":""} ${gc}" data-s="${s.id}" data-d="${isoD}" ${note}>${cellChip(sh)}${sh.note?'<span class="editdot"></span>':""}</td>`;
    }).join("")+`</tr>`;
  }).join("");
  return `<div class="card" style="padding:14px 14px 10px">
    ${archiveBanner()}
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>Roster grid</h2>${statusPill}<span class="grow"></span>
      <button class="btn sm ${gapsOn?"primary":""}" id="gapsToggle">${gapsOn?"✓ Gaps ("+totalGap+" short)":"Show gaps"}</button>
      <button class="btn sm" id="rosXls">⬇ Excel</button><button class="btn sm" id="rosCsv">⬇ CSV</button>
      <button class="btn sm" id="rosPay" title="RosterOn payroll import — one row per shift, with times &amp; hours">⬇ Payroll (RosterOn)</button>
    </div>
    <div class="sub">${editable?"Click any cell to assign. ":"Read-only. "}Capacity-aware: a zone taken by one person is disabled for everyone else; the 4th+ slot stays locked until minimums are met (${unlockOrderLabel()}).</div>
    ${editable?"":lockNote()}
    ${S.staff.length?"":`<div class="note">No staff yet. Import your roster in <b>Admin settings → Import data</b>, or add staff in the <b>Staff</b> tab.</div>`}
    ${editable&&needsComment()?`<div class="note">✎ This roster is <b>Published</b> — edits are allowed but need a comment, are logged, and show on hover (cells with a change have a dot).</div>`:""}
    <div class="gridscroll"><table class="roster"><thead>${head}${caprow}</thead><tbody>${body}</tbody></table></div>

let lastEmail=null, plannerMonth=null;
function requestHoursDays(r){const days=daysInRange(r.dateFrom,r.dateTo).length;const s=S.staff.find(x=>x.id===r.from)||{hrsFortnight:76};return {days:days,hrs:Math.round(days*hoursPerDay(s))};}
function submitLeaveRequest(staffId,from,to,code,reason){
  S.requests.unshift({id:"r"+Date.now(),type:"leave",from:staffId,dateFrom:from,dateTo:to,code:code,reason:reason||"",status:"pending",createdTs:Date.now()});
  notify("admin",nameOf(staffId)+" requested "+(LEAVE_LABEL[code]||code)+" "+from+"→"+to);
  logAudit("leave.request",(LEAVE_LABEL[code]||code)+" "+from+"→"+to+(reason?(" · "+reason):""),staffId);
  save();
}
function approveRequest(id,comment){
  const r=S.requests.find(x=>x.id===id);if(!r)return;
  r.status="approved";r.decidedTs=Date.now();r.adminComment=comment||"";
  if(r.type==="fixed"){ const s=S.staff.find(x=>x.id===r.from); if(s){ r.pattern.committed=true; s.fixedPattern=r.pattern; }
    notify(r.from,"Your fixed-pattern change was approved."+(comment?(" "+comment):""));
    logAudit("fixed.approve",nameOf(r.from)+" · "+fixedPatternSummary(r.pattern)+(comment?(" · "+comment):""),"admin"); save(); return; }
  if(r.type==="leave"){
    const dates=daysInRange(r.dateFrom,r.dateTo);
    S.cycles.forEach(c=>dates.forEach(d=>{delete c.assign[r.from+"|"+d];}));
    addLeave({staffId:r.from,from:r.dateFrom,to:r.dateTo,code:r.code,status:"approved",requestId:id});
  }
  notify(r.from,"Your "+(LEAVE_LABEL[r.code]||r.code)+" leave "+r.dateFrom+"→"+r.dateTo+" was approved."+(comment?(" "+comment):""));
  logAudit("leave.approve",nameOf(r.from)+" "+r.code+" "+r.dateFrom+"→"+r.dateTo+(comment?(" · "+comment):""),"admin");
  prepEmail(r,"approved",comment);save();
}
function declineRequest(id,comment){
  const r=S.requests.find(x=>x.id===id);if(!r)return;
  r.status="declined";r.decidedTs=Date.now();r.adminComment=comment||"";
  if(r.type==="fixed"){ notify(r.from,"Your fixed-pattern change was declined."+(comment?(" "+comment):""));
    logAudit("fixed.decline",nameOf(r.from)+(comment?(" · "+comment):""),"admin"); save(); return; }
  notify(r.from,"Your "+(LEAVE_LABEL[r.code]||r.code)+" leave "+r.dateFrom+"→"+r.dateTo+" was declined."+(comment?(" "+comment):""));
  logAudit("leave.decline",nameOf(r.from)+" "+r.code+" "+r.dateFrom+"→"+r.dateTo+(comment?(" · "+comment):""),"admin");
  prepEmail(r,"declined",comment);save();
}
function prepEmail(r,decision,comment){

const FT_HRS_WEEK=38; // full-time hours/week (76/fortnight) — used to convert hours/week back to EFT fraction
function parseEftTracker(wb, cycleStartISO){
  let chosen=null, latest=null;
  wb.SheetNames.forEach(name=>{
    let aoa; try{aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});}catch(e){return;}
    let hr=-1; for(let r=0;r<Math.min(aoa.length,14);r++){ if((aoa[r]||[]).some(c=>/employee\s*#|emp\s*no|payroll/i.test(String(c==null?"":c)))){hr=r;break;} }
    if(hr<0)return;
    const dcols=[]; (aoa[hr]||[]).forEach((v,c)=>{const di=cellISO(v); if(di)dcols.push({c:c,iso:di});});
    if(!dcols.length)return;
    const cand={name:name,aoa:aoa,hr:hr,dcols:dcols,first:dcols[0].iso,last:dcols[dcols.length-1].iso};
    if(!latest||cand.first>latest.first)latest=cand;
    if(cycleStartISO>=cand.first && cycleStartISO<=iso(addDays(parseISO(cand.last),6)))chosen=cand;
  });
  const c=chosen||latest;
  if(!c)return {error:"No tracker sheet found (need an 'Employee #' header row with weekly date columns)."};
  let tc=null; c.dcols.forEach(d=>{ if(d.iso<=cycleStartISO && (!tc||d.iso>=tc.iso))tc=d; }); if(!tc)tc=c.dcols[0];
  const rows=[];
  for(let r=c.hr+1;r<c.aoa.length;r++){ const row=c.aoa[r]||[];
    const last=String(row[1]==null?"":row[1]).trim(), first=String(row[2]==null?"":row[2]).trim();
    if(!last||!/[A-Za-z]/.test(last))continue;
    let val=(typeof row[tc.c]==="number")?row[tc.c]:numFrom(row[tc.c]);
    if(val==null){ for(let k=c.dcols.length-1;k>=0;k--){const dv=row[c.dcols[k].c]; if(typeof dv==="number"){val=dv;break;}} }
    if(val==null)continue;
    const eft = val>1.5 ? round2(val/FT_HRS_WEEK) : round2(val);   // auto-detect: >1.5 = hours/week, else EFT fraction
    const emp=row[0]; rows.push({empNo: emp==null?"":String(emp).replace(/\.0+$/,"").trim(), sur:last, giv:first, eft:eft});
  }
  return {sheet:c.name, week:tc.iso, rows:rows};
}
function applyEftTracker(p){
  const byEmp={}, bySur={};
  S.staff.forEach(s=>{ if(s.payrollId)byEmp[String(s.payrollId)]=s; const sur=splitName(s.name).sur; (bySur[normName(sur)]=bySur[normName(sur)]||[]).push(s); });
  let n=0; const unmatched=[];
  p.rows.forEach(rw=>{
    let s=(rw.empNo&&byEmp[rw.empNo])||null;
    if(!s){ const cands=bySur[normName(rw.sur)]||[];
      if(cands.length===1)s=cands[0];
      else if(cands.length>1)s=cands.find(c=>normName(splitName(c.name).giv).charAt(0)===normName(rw.giv).charAt(0))||cands[0]; }
    if(!s){ unmatched.push(rw.sur+(rw.giv?", "+rw.giv:"")); return; }
    if(rw.eft!=null){ s.eft=rw.eft; s.hrsFortnight=round2(rw.eft*76); }
    if(rw.empNo && !s.payrollId)s.payrollId=rw.empNo;   // link Employee # → payroll export
    n++;

  return {n:n, unmatched:unmatched};
}

function splitName(n){n=String(n||"").trim();if(n.indexOf(",")>=0){const a=n.split(",");return{sur:a[0].trim(),giv:(a[1]||"").trim()};}const a=n.split(/\s+/);if(a.length<2)return{sur:n,giv:""};return{sur:a[a.length-1],giv:a.slice(0,-1).join(" ")};}
function isOnCallZone(z){if(!z)return false;return /\bOC\b|ON.?CALL|\+\s*OC/i.test((z.pmLabel||"")+" "+(z.name||""));}
function payrollRows(){
  const rows=[],ds=cycleDates();

      const add=(t,unit,note)=>rows.push(Object.assign({},base,{code:t.code,start:t.start,end:t.end,hours:t.hours,unit:unit||"",note:note||""}));
      if(sh.kind==="clinical"){const z=zoneById(sh.zone),zn=z?z.name:"";
        if(sh.period==="AM")add(SHIFT_TIMES.AM,zn,"");
        else if(sh.period==="PM"){add(SHIFT_TIMES.PM,zn,"");if(isOnCallZone(z))add(SHIFT_TIMES.ONC,zn,"On-call");}
      } else if(sh.kind==="cst") add(SHIFT_TIMES.CST,"","CST");
      else if(sh.kind==="leave") rows.push(Object.assign({},base,{code:sh.code,start:"",end:"",hours:leaveHours(s),unit:"",note:LEAVE_LABEL[sh.code]||"Leave"}));

const PAYROLL_FIELDS=[
  ["emp","Employee No"],["sur","Surname"],["giv","Given Name"],["name","Full name"],
  ["date","Date"],["code","Shift Code"],["start","Start time"],["end","End time"],
  ["hours","Hours"],["unit","Unit / area"],["note","Notes"]

function payrollFieldValue(r,key){switch(key){
  case "emp":return r.emp;case "sur":return r.sur;case "giv":return r.giv;case "name":return r.name;
  case "date":return fmtDate(r.date);case "code":return r.code;case "start":return r.start;case "end":return r.end;
  case "hours":return r.hours;case "unit":return r.unit;case "note":return r.note;default:return "";}}
// Guess which roster field feeds a RosterOn column from its header text:
function autoMapField(h){const s=String(h||"").toLowerCase();
  if(/surname|last\s*name|family/.test(s))return "sur";
  if(/given|first\s*name|forename|christian/.test(s))return "giv";
  if(/payroll|personnel|(emp(loyee)?|staff|pay)\s*(no|num|#|id|code)/.test(s))return "emp";
  if(/date/.test(s))return "date";
  if(/start|begin|\bfrom\b|time\s*in|commence/.test(s))return "start";
  if(/end|finish|\bto\b|time\s*out|cease/.test(s))return "end";
  if(/hour|hrs|duration|qty|quantity|\bunits?\b/.test(s))return "hours";
  if(/shift|code|activity|duty|task/.test(s))return "code";
  if(/unit|ward|cost|location|dept|department|\barea\b|team/.test(s))return "unit";
  if(/note|comment|desc|remark/.test(s))return "note";
  if(/name/.test(s))return "name";
  return "";}
function parseCSVLine(line){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const c=line[i];
  if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else{if(c===','){out.push(cur);cur="";}else if(c==='"')q=true;else cur+=c;}}
  out.push(cur);return out.map(x=>x.trim());}
function readPayrollTemplate(file){
  const finish=(hdrs)=>{let headers=(hdrs||[]).map(h=>String(h==null?"":h).trim());
    while(headers.length&&headers[headers.length-1]==="")headers.pop();
    if(!headers.length){alert("No column headers found in that file's first row.");return;}
    S.payrollTemplate={headers:headers,map:headers.map(autoMapField),filename:file.name};
    logAudit("payroll.template.upload",file.name+" — "+headers.length+" columns","admin");save();render();};
  const nm=(file.name||"").toLowerCase();
  if(nm.endsWith(".csv")){const r=new FileReader();
    r.onload=ev=>{const first=String(ev.target.result||"").split(/\r?\n/).find(l=>l.trim()!=="")||"";finish(parseCSVLine(first));};
    r.readAsText(file);
  } else {
    if(typeof XLSX==="undefined"){alert("Spreadsheet reader not loaded — check your connection and retry, or upload a .csv template.");return;}
    const r=new FileReader();
    r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});finish(aoa[0]||[]);}catch(x){alert("Couldn't read template: "+x.message);}};
    r.readAsArrayBuffer(file);
  }
}

function shiftTally(sid){ const ds=cycleDates(); let am=0,pm=0,cst=0; const zones={},leave={};

function agendaHTML(sid,from,to){
  const ds=cycleDates();
  const items=ds.filter(d=>iso(d)>=from&&iso(d)<=to).map(d=>({d,sh:getShift(sid,iso(d))}));
  if(!items.length)return '<div class="muted">No shifts in range.</div>';
  let agenda="",lastWk=null;
  items.forEach(({d,sh})=>{
    const wk=Math.floor((d-ds[0])/(7*864e5));
    if(wk!==lastWk){agenda+=`<div class="weekhdr">Week ${wk+1} · from ${fmt(addDays(ds[0],wk*7))}</div>`;lastWk=wk;}
    agenda+=`<div class="agday${[0,6].includes(d.getDay())?" we":""}"><div class="d"><div class="dn">${DOW[d.getDay()]}</div><div class="dd">${d.getDate()}</div></div><div class="grow">${shiftLine(sh)}</div></div>`;
  });
  return agenda;
}
function shiftLine(sh){

function monthHTML(sid,from,to){
  const ds=cycleDates();const items=ds.filter(d=>iso(d)>=from&&iso(d)<=to);
  if(!items.length)return '<div class="muted">No shifts in range.</div>';
  // group by month
  const months={};items.forEach(d=>{const k=d.getFullYear()+"-"+d.getMonth();(months[k]=months[k]||[]).push(d);});
  return Object.values(months).map(arr=>{
    const first=arr[0];const y=first.getFullYear(),m=first.getMonth();
    const start=new Date(y,m,1);const lead=start.getDay();
    const total=new Date(y,m+1,0).getDate();
    let cells="";
    for(let i=0;i<lead;i++)cells+=`<div class="mcell out"></div>`;
    for(let day=1;day<=total;day++){

  }).join("");
}

/* ---------- .ics export ---------- */
function exportICS(sid){
  const s=S.staff.find(x=>x.id===sid);const r=window._range;
  const ds=cycleDates().filter(d=>iso(d)>=r.from&&iso(d)<=r.to);
  let ev="";
  const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  ds.forEach(d=>{
    const sh=getShift(sid,iso(d));const dk=iso(d).replace(/-/g,"");
    if(sh.kind==="clinical"){
      const z=zoneById(sh.zone);const lbl=z?zoneLabel(z,sh.period):"";
      const[st,en]=sh.period==="AM"?["080000","160000"]:["153000","233000"];
      ev+=`BEGIN:VEVENT\nUID:${sid}-${dk}-${sh.period}@edroster\nDTSTAMP:${stamp}\nDTSTART:${dk}T${st}\nDTEND:${dk}T${en}\nSUMMARY:${lbl} (${sh.period})\nEND:VEVENT\n`;
    }else if(sh.kind==="cst"){
      ev+=`BEGIN:VEVENT\nUID:${sid}-${dk}-cst@edroster\nDTSTAMP:${stamp}\nDTSTART;VALUE=DATE:${dk}\nSUMMARY:CST (non-clinical)\nEND:VEVENT\n`;
    }else if(sh.kind==="leave"){
      ev+=`BEGIN:VEVENT\nUID:${sid}-${dk}-lv@edroster\nDTSTAMP:${stamp}\nDTSTART;VALUE=DATE:${dk}\nSUMMARY:${LEAVE_LABEL[sh.code]||sh.code}\nEND:VEVENT\n`;
    }
  });
  const cal=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Myrosta//EN\nCALSCALE:GREGORIAN\n${ev}END:VCALENDAR`;
  const blob=new Blob([cal],{type:"text/calendar"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="roster-"+sid+".ics";a.click();URL.revokeObjectURL(url);
}

  if(cloudOn()){
    load(); // have a valid local S so the auth screen can render while we connect
    authState="checking"; cloudState="connecting"; safeRenderInit();
    try{
      cloudInit();
      _sb.auth.onAuthStateChange((_e,sess)=>{ handleAuth(sess); });
      const {data}=await _sb.auth.getSession();
      await handleAuth(data?data.session:null);
    }catch(e){ console.error("cloud boot failed",e); cloudState="error"; alert("Cloud connection failed — running in local mode.\n\n"+e.message); authState="local"; load(); safeRenderInit(); }
  } else { authState="local"; load(); safeRenderInit(); }
}
boot();
</script>
</body>
